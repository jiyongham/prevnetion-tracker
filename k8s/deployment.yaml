apiVersion: apps/v1
kind: Deployment
metadata:
  name: dr-tracker
  namespace: dr-tracker
spec:
  replicas: 1   # sqlite 파일 하나를 여러 파드가 동시에 쓰면 깨질 수 있어 1로 고정
  strategy:
    rollingUpdate:
      maxSurge: 0        # 옛 파드를 먼저 내리고 새 파드를 띄움
      maxUnavailable: 1
  selector:
    matchLabels:
      app: dr-tracker
  template:
    metadata:
      labels:
        app: dr-tracker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull-secret
      # fsGroup(위)이 이 볼륨 소유권을 10001로 맞춰주는 게 정상이지만, kind 기본
      # 스토리지클래스(local-path-provisioner, hostPath 기반)는 fsGroup 적용을
      # 안정적으로 보장하지 않는 것으로 알려져 있다 - 특히 비루트 전환 전부터
      # 있던 기존 sqlite 파일은 root 소유로 남아 있을 수 있다. 그 결과가 "attempt
      # to write a readonly database": 파일 자체는 멀쩡한데 지금 컨테이너(UID 10001)가
      # 쓰기 권한이 없는 것뿐이다. fsGroup에 기대지 않고 매 기동 시 확실하게
      # chown하는 initContainer를 둬서 스토리지 드라이버 지원 여부와 무관하게 고친다.
      initContainers:
        - name: fix-data-perms
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 10001:10001 /app/data"]
          securityContext:
            # 파드 전체에 runAsNonRoot: true가 걸려 있어(위) 명시적으로 꺼주지 않으면
            # runAsUser: 0(root)과 충돌해서 이 initContainer 자체가 못 뜬다. 메인
            # 컨테이너는 이 설정 없이 그대로 비루트로 남는다 - 컨테이너별 securityContext는
            # 서로 독립적이라 여기서 풀어준다고 메인 컨테이너 권한이 넓어지지 않는다.
            runAsNonRoot: false
            runAsUser: 0   # chown 하려면 root로 떠야 한다
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: dr-tracker
          image: ghcr.io/jiyongham/prevention-tracker:latest
          imagePullPolicy: Always   # 레지스트리에서 최신 이미지를 매번 pull받기 위해 Always 사용 - latest 태그는 IfNotPresent로는 캐시된 옛 이미지를 계속 쓰게 됨
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: dr-tracker-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          # 제한이 없으면 한순간 메모리를 과하게 써도 kubelet이 못 잡아채고, kind처럼
          # 클러스터 전체가 컨테이너 하나(kindest/node)에 들어있는 로컬 환경에서는
          # 그게 호스트 메모리 압박으로 번져 노드(=클러스터 전체) 자체가 죽는 사고로
          # 이어질 수 있다. requests는 평소 사용량, limits는 이 값을 넘으면 파드만
          # OOMKilled로 재시작되게 하는 안전판 - 노드 전체가 아니라 이 파드 선에서 끊는다.
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
          # readinessProbe만 있으면 프로세스가 죽지 않고 내부적으로 멈춰(deadlock 등)
          # 응답을 안 하는 경우, 트래픽만 안 보낼 뿐 재시작은 안 된다. liveness를 추가해
          # 그런 경우엔 kubelet이 컨테이너를 재시작하게 한다.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: data
          persistentVolumeClaim:
            claimName: dr-tracker-data
