<!-- app/web/templates/logs.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>변경 이력</title>
  <link rel="stylesheet" href="/static/style.css?v=10">
</head>
<body>
<div class="container">
  <header>
    <h1>📝 변경 이력</h1>
    <a href="/" class="btn-sm">← 대시보드</a>
  </header>

  <section class="panel">
    <table>
      <thead>
        <tr><th>일시</th><th>NO</th><th>반기</th><th>항목</th><th>이전</th><th>변경</th><th>수정자</th></tr>
      </thead>
      <tbody>
      {% for l in logs %}
        <tr>
          <td class="mono small">{{ l.updated_at }}</td>
          <td>{{ l.item_no }}</td>
          <td>{{ l.half }}</td>
          <td>{{ l.field }}</td>
          <td class="muted">{{ l.old_value or '-' }}</td>
          <td class="strong">{{ l.new_value or '-' }}</td>
          <td>{{ l.updated_by or '-' }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
    {% if not logs %}<p class="muted" style="padding:20px">이력이 없습니다.</p>{% endif %}
  </section>
</div>
</body>
</html>
