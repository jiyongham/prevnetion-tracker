name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest \
            git /repo --exit-code 1 --verbose

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest

      - name: Python syntax check
        run: python -m compileall -q app

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image for scanning
        run: docker build -t dr-tracker:ci .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'dr-tracker:ci'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

  deploy:
    needs: [pr-checks, image-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    env:
      # 셀프호스티드 러너가 systemd 서비스로 뜰 때 PATH가 제한적이라 kind/kubectl(/usr/local/bin)을 못 찾는 문제 방지
      PATH: /usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t ghcr.io/jiyongham/prevention-tracker:latest -t ghcr.io/jiyongham/prevention-tracker:${{ github.sha }} .

      - name: Push image to ghcr.io
        run: |
          docker push ghcr.io/jiyongham/prevention-tracker:latest
          docker push ghcr.io/jiyongham/prevention-tracker:${{ github.sha }}


      - name: Apply Kubernetes manifests
        # deployment.yaml 등 k8s/ 매니페스트를 수정해도 rollout restart만으로는 클러스터에
        # 반영되지 않는다 (파드 스펙이 바뀌어야 롤아웃이 트리거된다). apply를 먼저 실행해
        # image/imagePullPolicy/imagePullSecrets 같은 변경이 실제로 적용되게 한다.
        # servicemonitor.yaml은 Prometheus Operator CRD가 있어야 하므로 제외.
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/pvc.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/deployment.yaml

      - name: Rollout restart
        run: kubectl -n dr-tracker rollout restart deployment/dr-tracker

      - name: Wait for rollout
        run: kubectl -n dr-tracker rollout status deployment/dr-tracker --timeout=120s
