name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest

      - name: Python syntax check
        run: python -m compileall -q app

      - name: Docker build check
        run: docker build -t dr-tracker:ci .

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest \
            git /repo --exit-code 1 --verbose

      - name: Build Docker image for scanning
        run: docker build -t dr-tracker:ci .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'dr-tracker:ci'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

  deploy:
    needs: [ci, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    env:
      # 셀프호스티드 러너가 systemd 서비스로 뜰 때 PATH가 제한적이라 kind/kubectl(/usr/local/bin)을 못 찾는 문제 방지
      PATH: /usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t dr-tracker:local .

      - name: Load image into kind
        run: kind load docker-image dr-tracker:local --name dr-tracker

      - name: Rollout restart
        run: kubectl -n dr-tracker rollout restart deployment/dr-tracker

      - name: Wait for rollout
        run: kubectl -n dr-tracker rollout status deployment/dr-tracker --timeout=120s
